# Template: nightly matched-digest send. Copy to .github/workflows/ to activate.
name: bidbeacon-digests
on:
  schedule:
    - cron: "30 6 * * 1-5"   # 06:30 UTC, weekdays (after the 05:00 ingest)
  workflow_dispatch: {}
jobs:
  digests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Send digests
        working-directory: contractradar
        env:
          DATABASE_URL:     ${{ secrets.DATABASE_URL }}
          SUPABASE_URL:     ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:     ${{ secrets.SUPABASE_KEY }}
          RESEND_API_KEY:   ${{ secrets.RESEND_API_KEY }}
          BIDBEACON_FROM:   "BidBeacon <alerts@bidbeacon.co.uk>"
        run: PYTHONPATH=. python3 -m radar.notify
